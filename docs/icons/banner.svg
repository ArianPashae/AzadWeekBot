<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="auto" fill="none">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#09101E"/>
    </linearGradient>
    <radialGradient id="orb1" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="80%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="cardStroke" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="1196" height="316" rx="28" fill="url(#heroBg)" stroke="url(#cardStroke)" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="316" rx="28" fill="url(#orb1)"/>
  <rect x="2" y="2" width="1196" height="316" rx="28" fill="url(#orb2)"/>

  <!-- Subtle Grid Pattern -->
  <g stroke="#94A3B8" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="240" y1="0" x2="240" y2="320"/>
    <line x1="480" y1="0" x2="480" y2="320"/>
    <line x1="720" y1="0" x2="720" y2="320"/>
    <line x1="960" y1="0" x2="960" y2="320"/>
  </g>

  <!-- Center Premium Icon Badge -->
  <g transform="translate(560, 28)">
    <rect x="0" y="0" width="80" height="80" rx="22" fill="#0F172A" stroke="url(#accentGrad)" stroke-width="2.2"/>
    <rect x="16" y="18" width="48" height="44" rx="10" stroke="url(#accentGrad)" stroke-width="2.8" fill="#1E293B" fill-opacity="0.7"/>
    <line x1="16" y1="31" x2="64" y2="31" stroke="url(#accentGrad)" stroke-width="2.5"/>
    <line x1="28" y1="13" x2="28" y2="22" stroke="#34D399" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="52" y1="13" x2="52" y2="22" stroke="#38BDF8" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="30" cy="42" r="4" fill="#34D399"/>
    <circle cx="40" cy="42" r="4" fill="#38BDF8"/>
    <circle cx="50" cy="42" r="4" fill="#818CF8"/>
    <circle cx="30" cy="52" r="4" fill="#FBBF24"/>
    <circle cx="40" cy="52" r="4" fill="#34D399"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="600" y="152" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="0.5">AzadWeek  |  آزادویک</text>
  <text x="600" y="190" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500">Smart Telegram Bot &amp; Native Mini App (PWA) for Islamic Azad University Odd &amp; Even Weeks</text>
  <text x="600" y="222" text-anchor="middle" fill="#38BDF8" font-family="Tahoma, 'Segoe UI', sans-serif" font-size="17" font-weight="600">ربات هوشمند تلگرام و مینی‌اپ اختصاصی تقویم آموزشی هفته‌های زوج و فرد دانشگاه آزاد اسلامی</text>

  <!-- Feature Pills -->
  <g transform="translate(215, 250)">
    <rect x="0" y="0" width="175" height="36" rx="18" fill="#1E293B" stroke="#34D399" stroke-opacity="0.45" stroke-width="1.2"/>
    <circle cx="22" cy="18" r="5" fill="#34D399"/>
    <text x="96" y="23" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Odd / Even Engine</text>

    <rect x="195" y="0" width="185" height="36" rx="18" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.2"/>
    <circle cx="217" cy="18" r="5" fill="#38BDF8"/>
    <text x="296" y="23" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Telegram Mini App</text>

    <rect x="400" y="0" width="175" height="36" rx="18" fill="#1E293B" stroke="#818CF8" stroke-opacity="0.45" stroke-width="1.2"/>
    <circle cx="422" cy="18" r="5" fill="#818CF8"/>
    <text x="496" y="23" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Story &amp; ICS Export</text>

    <rect x="595" y="0" width="175" height="36" rx="18" fill="#1E293B" stroke="#FBBF24" stroke-opacity="0.45" stroke-width="1.2"/>
    <circle cx="617" cy="18" r="5" fill="#FBBF24"/>
    <text x="690" y="23" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Smart Cron Worker</text>
